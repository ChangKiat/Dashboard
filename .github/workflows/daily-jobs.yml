name: Daily jobs

# Wakes the deployed Dashboard and runs its due daily jobs (8:00 weigh-in reminder, 9:00 fixed
# bills and interest, Asia/Kuala_Lumpur). The server records each day it ran, so extra pings are
# harmless; the later ones cover a GitHub schedule that ran late or not at all.
# Needs the repository secrets DASHBOARD_URL (e.g. https://your-app.onrender.com) and
# SCHEDULER_SECRET (the same value as on the server).

on:
  schedule:
    - cron: '5 0 * * *' # 08:05 KL
    - cron: '5 1 * * *' # 09:05 KL
    - cron: '35 2 * * *' # 10:35 KL
    - cron: '5 6 * * *' # 14:05 KL
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run due jobs on the Dashboard
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$SCHEDULER_SECRET" ]; then
            echo "Set the DASHBOARD_URL and SCHEDULER_SECRET repository secrets to turn this on."
            exit 0
          fi
          # A sleeping free-tier server can take a minute to wake: retry instead of failing.
          curl --silent --show-error --fail-with-body \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 180 \
            -X POST -H "Authorization: Bearer $SCHEDULER_SECRET" \
            "${DASHBOARD_URL%/}/api/scheduler/run"
